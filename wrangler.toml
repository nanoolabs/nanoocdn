#:schema node_modules/wrangler/config-schema.json
# For more details on how to configure Wrangler, refer to:
# https://developers.cloudflare.com/workers/wrangler/configuration/
name = "nanoocdn"
workers_dev = true
compatibility_date = "2024-09-25"
main = "src/index.js"
upload_source_maps = true
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./public/"

[vars]
# B2 key ID is public
B2_APPLICATION_KEY_ID = "0038f4a4d378b380000000013"
# EU region S3-compatible endpoint
B2_ENDPOINT = "s3.eu-central-003.backblazeb2.com"
# Literal bucket name; set to "$path" or "$host" to route to multiple buckets via URL
BUCKET_NAME = "nanoo-assets"
# false = reject bucket listing at root (404); true = allow GET /?list-type=2
ALLOW_LIST_BUCKET = "false"
# true = strip the "file/{bucket}/" prefix rclone add via --b2-download-url
RCLONE_DOWNLOAD = "false"
# Whitelist of headers forwarded to the SigV4 signature. Keep x-amz-content-sha256,
# or aws4fetch falls back to UNSIGNED-PAYLOAD
ALLOWED_HEADERS = ["range", "x-amz-content-sha256"]
# show version on home page
CDN_VERSION = "2.2.6"

[observability]
enabled = true

# Smart Placement
# https://developers.cloudflare.com/workers/configuration/smart-placement/#smart-placement
# [placement]
# mode = "smart"

# Bindings
# Bindings allow your Worker to interact with resources on the Cloudflare Developer Platform, including
# databases, object storage, AI inference, real-time communication and more.
# https://developers.cloudflare.com/workers/runtime-apis/bindings/

# Static Assets
# https://developers.cloudflare.com/workers/static-assets/binding/

# Service Bindings (communicate between multiple Workers)
# https://developers.cloudflare.com/workers/wrangler/configuration/#service-bindings
# [[services]]
# binding = "MY_SERVICE"
# service = "my-service"

# Routes & Domain
[[routes]]
pattern = "cdn.nanoolabs.dev"
custom_domain = true
